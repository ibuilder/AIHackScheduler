# Run from the repository root:
#   docker compose -f deployment/docker-compose.yml up
#
# The build context is the repository root, not this directory, because the
# Dockerfile installs the project with `pip install .` and needs pyproject.toml.
#
# This file previously also declared nginx, Prometheus and Grafana services that
# mounted ./nginx/nginx.conf, ./monitoring/prometheus.yml and two Grafana
# provisioning directories. None of those files exist in the repository, so
# Docker created empty directories in their place and those containers failed to
# start. They are omitted rather than left as scenery; bring them back alongside
# the configuration they need.

services:
  bbschedule:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://bbschedule:${DB_PASSWORD}@postgres:5432/bbschedule
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - POWERBI_CLIENT_ID=${POWERBI_CLIENT_ID:-}
      - POWERBI_CLIENT_SECRET=${POWERBI_CLIENT_SECRET:-}
      - POWERBI_TENANT_ID=${POWERBI_TENANT_ID:-}
      # Set SEED_DEMO=1 to load the demo project on first start.
      - SEED_DEMO=${SEED_DEMO:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=bbschedule
      - POSTGRES_USER=bbschedule
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbschedule"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # The Celery application lives at tasks.celery_config.celery_app. Both worker
  # services previously named `app.celery`, which does not exist, so neither
  # container could start.
  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: celery -A tasks.celery_config.celery_app worker --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://bbschedule:${DB_PASSWORD}@postgres:5432/bbschedule
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      # The web service owns schema creation; workers must not race it.
      - SKIP_DB_INIT=1
    depends_on:
      bbschedule:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: celery -A tasks.celery_config.celery_app beat --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://bbschedule:${DB_PASSWORD}@postgres:5432/bbschedule
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - SKIP_DB_INIT=1
    depends_on:
      bbschedule:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
