name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest --cov=core --cov=services --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        # Pinned to match the version in the dev extra, so a ruff release
        # cannot fail this job without a change to the codebase.
        run: pip install ruff==0.16.2

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  smoke:
    name: App boots and seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create schema and seed the demo project
        env:
          FLASK_ENV: development
          SESSION_SECRET: ci-smoke-test-secret
        run: |
          flask --app app init-db
          flask --app app seed-demo

  package:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The Dockerfile installs the project with `pip install .`, so a
      # pyproject that cannot build breaks the image without breaking any test.
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Check the licence metadata survived
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          archive = zipfile.ZipFile(wheel)
          name = [n for n in archive.namelist() if n.endswith("METADATA")][0]
          metadata = archive.read(name).decode()
          assert "License-Expression: MIT" in metadata, metadata
          assert any("LICENSE" in n for n in archive.namelist()), "LICENSE not bundled"
          print(f"{wheel}: MIT, LICENSE bundled")
          EOF
