name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Bounded for the same reason as ruff: pytest 9 changed plugin hook
          # handling, and an unbounded install would apply that on its own
          # schedule to a build nobody touched.
          pip install "pytest>=8,<10" "pytest-cov>=5,<8" "pyyaml>=6.0,<8"

      - name: Run tests
        run: pytest --cov=core --cov=services --cov-report=term-missing

  extras:
    name: Optional extras install and import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # None of the optional packages appear in requirements.txt, so every
      # other job installs none of them. That made the bounds on redis, openai,
      # stripe and mpxj unfalsifiable: a dependency update widening one of them
      # passed all eight jobs without a single line of the affected code being
      # imported. This job is what gives those bounds evidence.
      - name: Install every extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres,async,integrations,mpp]"
          pip install "pytest>=8,<10" "pyyaml>=6.0,<8"

      - name: The optional integrations import and the app still boots
        env:
          FLASK_ENV: development
          SESSION_SECRET: ci-extras-secret
        run: |
          python - <<'EOF'
          import importlib

          # Imported through services.optional at runtime, never at module
          # scope — so nothing else would notice a breaking major.
          for name in ("openai", "stripe", "redis", "celery", "openpyxl",
                       "jwt", "oauthlib", "flask_dance", "psycopg2",
                       "azure.identity", "azure.storage.blob"):
              importlib.import_module(name)
              print(f"  {name} imports")

          from app import create_app
          create_app().test_client().get("/health/health")
          print("app boots with every extra installed")
          EOF

      # The MPXJ bridge needs a JVM, which is why it had never run anywhere.
      # GitHub's runners have one.
      - name: Exercise the MPXJ bridge
        run: |
          java -version
          pytest tests/test_mpp.py -m mpp -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        # Pinned to match the version in the dev extra, so a ruff release
        # cannot fail this job without a change to the codebase.
        run: pip install ruff==0.16.2

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  smoke:
    name: App boots and seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # `db upgrade`, matching what the container entrypoint runs, rather than
      # init-db — so the smoke test exercises the real deployment path.
      - name: Migrate and seed the demo project
        env:
          FLASK_ENV: development
          SESSION_SECRET: ci-smoke-test-secret
        run: |
          flask --app app db upgrade
          flask --app app seed-demo

  migrations:
    name: Migrations match the models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The schema changed six times with no migrations, so an existing
      # database had no upgrade path. This catches a model change that ships
      # without one: after upgrading from empty, autogenerate must find nothing
      # left to do.
      - name: Upgrade from empty and check for drift
        env:
          FLASK_ENV: development
          SESSION_SECRET: ci-migration-secret
          DATABASE_URL: sqlite:///ci-migration-check.db
        run: |
          flask --app app db upgrade
          flask --app app db check 2>&1 | tee check.log
          grep -q "No new upgrade operations detected" check.log || {
            echo "::error::The models have changed without a migration. Run: flask db migrate"
            exit 1
          }

      - name: Downgrade and upgrade again
        env:
          FLASK_ENV: development
          SESSION_SECRET: ci-migration-secret
          DATABASE_URL: sqlite:///ci-migration-check.db
        run: |
          flask --app app db downgrade
          flask --app app db upgrade

  docker:
    name: Image builds and the stack is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The compose file previously mounted five configuration files that do
      # not exist and named a Celery app that does not exist, so the stack
      # could not come up. `config` resolves and validates it.
      - name: Validate the compose stack
        run: docker compose -f deployment/docker-compose.yml config >/dev/null
        env:
          DB_PASSWORD: ci
          SESSION_SECRET: ci

      # The image install failed outright once pyproject declared its packages
      # explicitly, because the builder stage copied only pyproject.toml.
      - name: Build the image
        run: docker build -f deployment/Dockerfile -t bbschedule:ci .

      - name: Entrypoint is present and executable
        run: |
          docker run --rm --entrypoint sh bbschedule:ci -c \
            'test -x /app/deployment/entrypoint.sh && echo "entrypoint OK"'

      - name: The Celery app the compose file names actually resolves
        run: |
          docker run --rm --entrypoint python bbschedule:ci -c \
            'import tasks.celery_config as m; assert m.celery_app; print("celery_app OK")'

  package:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # The Dockerfile installs the project with `pip install .`, so a
      # pyproject that cannot build breaks the image without breaking any test.
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Check the licence metadata survived
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          archive = zipfile.ZipFile(wheel)
          name = [n for n in archive.namelist() if n.endswith("METADATA")][0]
          metadata = archive.read(name).decode()
          assert "License-Expression: MIT" in metadata, metadata
          assert any("LICENSE" in n for n in archive.namelist()), "LICENSE not bundled"
          print(f"{wheel}: MIT, LICENSE bundled")
          EOF
